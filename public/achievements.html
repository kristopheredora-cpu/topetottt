<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <meta name="description" content="TOPETOTTT: a personal Steam gaming portfolio and game tracker.">
  <title>Achievements — TOPETOTTT</title>
  <script>(function(d){var m=!matchMedia("(prefers-reduced-motion: reduce)").matches;if("IntersectionObserver"in window&&m)d.classList.add("reveal-on");try{if(m&&(location.search.indexOf("intro")>-1||!sessionStorage.getItem("introSeen"))){d.classList.add("intro-pending");setTimeout(function(){d.classList.remove("intro-pending")},8000)}}catch(e){}})(document.documentElement)</script>
  <link rel="stylesheet" href="/styles.css?v=18">
</head>
<body data-page="achievements">
  <main>
    <header class="page-head head-row reveal">
      <div><p class="eyebrow">Across my library</p><h1 class="page-title">Achievements</h1>
        <p class="page-sub">Every game's achievement progress in one place. It's scanned from Steam and remembered for a few hours.</p></div>
      <button id="ac-rescan" class="button button-secondary" type="button">↻ Rescan</button>
    </header>
    <div id="ac-progress" class="ac-progress hidden"><div class="bar"><span id="ac-progress-bar" style="width:0"></span></div><p id="ac-progress-text" class="muted">Scanning…</p></div>
    <div id="ac-summary" class="reveal"></div>
    <section class="ac-block reveal">
      <div class="ac-head"><h2>Perfect games</h2><span id="ac-perfect-note" class="section-note"></span></div>
      <div id="ac-perfect" class="ac-shelf"></div>
    </section>
    <section class="ac-block reveal">
      <div class="ac-head"><h2>Latest unlocks</h2></div>
      <div id="ac-latest" class="ac-feed"></div>
    </section>
    <section class="ac-block reveal">
      <div class="ac-head"><h2>Every game</h2></div>
      <div class="tr-controls">
        <div id="ac-tabs" class="chips-row"></div>
        <span class="grow"></span>
        <select id="ac-sort" aria-label="Sort games">
          <option value="pct">Highest completion</option>
          <option value="left">Closest to 100%</option>
          <option value="unlocked">Most unlocked</option>
          <option value="name">Name A–Z</option>
        </select>
        <input id="ac-search" type="search" placeholder="Search games…" aria-label="Search games">
      </div>
      <div id="ac-list" class="ac-list"></div>
    </section>
  </main>

  <script src="/shell.js?v=18" defer></script>
  <script src="/app.js" defer></script>
  <script src="/dialog.js?v=14" defer></script>
  <script src="/achievements.js?v=17" defer></script>
  <script src="/showcase/manifest.js" defer></script>
  <script src="/showcase/showcase.js?v=17" defer></script>
</body>
</html>
