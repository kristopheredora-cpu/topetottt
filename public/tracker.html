<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <meta name="description" content="TOPETOTTT: a personal Steam gaming portfolio and game tracker.">
  <title>Tracker — TOPETOTTT</title>
  <script>(function(d){var m=!matchMedia("(prefers-reduced-motion: reduce)").matches;if("IntersectionObserver"in window&&m)d.classList.add("reveal-on");try{if(m&&(location.search.indexOf("intro")>-1||!sessionStorage.getItem("introSeen"))){d.classList.add("intro-pending");setTimeout(function(){d.classList.remove("intro-pending")},8000)}}catch(e){}try{if(sessionStorage.getItem("portfolioAdminToken"))d.classList.add("is-owner")}catch(e){}})(document.documentElement)</script>
  <link rel="stylesheet" href="/styles.css?v=19">
</head>
<body data-page="tracker">
  <main>
    <header class="page-head head-row reveal">
      <div><p class="eyebrow">My personal log</p><h1 class="page-title">Game tracker</h1>
        <p class="page-sub">My status, rating, review and notes for every game I track. Steam supplies the playtime.</p></div>
      <a class="section-link" href="/library.html">Track a game from the library →</a>
    </header>
    <div id="tr-summary" class="reveal"></div>
    <section id="tr-pick" class="tr-pick reveal" aria-label="Pick my next game">
      <div class="tr-pick-copy">
        <p class="eyebrow">Can't decide?</p>
        <h2>Pick my next game</h2>
        <p id="tr-pick-sub" class="muted">Spin the dice and let the backlog decide.</p>
        <button id="tr-pick-btn" class="button button-primary" type="button">🎲 Spin the backlog</button>
      </div>
      <div class="tr-pick-stage" aria-live="polite">
        <div class="tr-slot"><img id="tr-slot-img" alt=""><span id="tr-slot-name"></span></div>
        <div id="tr-pick-result" class="tr-pick-result"></div>
      </div>
    </section>
    <div class="tr-controls reveal">
      <div id="tr-tabs" class="chips-row"></div>
      <span class="grow"></span>
      <select id="tr-sort" aria-label="Sort entries">
        <option value="updated">Recently updated</option>
        <option value="rating">Highest rated</option>
        <option value="hours">Most played</option>
        <option value="name">Name A–Z</option>
      </select>
      <input id="tr-search" type="search" placeholder="Search entries…" aria-label="Search entries">
    </div>
    <div id="tracker-grid" class="tr-grid reveal"><p class="muted">Loading tracker…</p></div>
  </main>

  <script src="/shell.js?v=19" defer></script>
  <script src="/app.js" defer></script>
  <script src="/dialog.js?v=19" defer></script>
  <script src="/tracker.js?v=19" defer></script>
  <script src="/showcase/manifest.js" defer></script>
  <script src="/showcase/showcase.js?v=19" defer></script>
</body>
</html>
